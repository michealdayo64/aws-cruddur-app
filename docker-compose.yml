version: "3.8"
services:

  xray-daemon:
    image: "amazon/aws-xray-daemon"
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${AWS_DEFAULT_REGION}"
    command:
      - "xray, -o"
    ports:
      - "2000:2000/udp"

  backend-flask:
    environment:
      VITE_APP_FRONTEND_URL: "http://127.0.0.1:5173"
      VITE_APP_BACKEND_URL: "http://127.0.0.1:5000"
      AWS_XRAY_URL: "*4567"
      AWS_XRAY_DAEMON_ADDRESS: "xray-daemon:2000"
      #OTEL_EXPORTER_OTLP_ENDPOINT: "https://api.honeycomb.io"
      #OTEL_EXPORTER_OTLP_HEADERS: "x-honeycomb-team=${HONEYCOMB_API_KEY}"
      #OTEL_SERVICE_NAME: "${HONEYCOMB_SERVICE_NAME}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
    build: ./backend-flask
    ports:
      - "5000:5000"
    volumes:
      - ./backend-flask:/backend-flask

  frontend-react-js:
    build: ./frontend-react-js
    ports:
      - "5173:5173"
    environment:
      VITE_APP_BACKEND_URL: "${VITE_APP_BACKEND_URL}"
      VITE_AWS_PROJECT_REGION: "${VITE_AWS_PROJECT_REGION}"
      VITE_APP_AWS_COGNITO_REGION: "${VITE_APP_AWS_COGNITO_REGION}"
      VITE_APP_AWS_USER_POOLS_ID: "${VITE_APP_AWS_USER_POOLS_ID}"
      VITE_APP_CLIENT_ID: "${VITE_APP_CLIENT_ID}"
    volumes:
      - ./frontend-react-js:/frontend-react-js
      - /frontend-react-js/node_modules

  db:
    image: postgres:13-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - '5432:5432'
    volumes: 
      - db:/var/lib/postgresql/data

  dynamodb-local:
    # https://stackoverflow.com/questions/67533058/persist-local-dynamodb-data-in-volumes-lack-permission-unable-to-open-databa
    # We needed to add user:root to get this working.
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal

# the name flag is a hack to change the default prepend folder
# name when outputting the image names
networks: 
  internal-network:
    driver: bridge
    name: cruddur

volumes:
  db:
    driver: local